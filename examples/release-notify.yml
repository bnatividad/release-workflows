name: Release notify

# Posts to Discord whenever "Release and deploy" finishes. The pipeline lives in bnatividad/release-workflows.
on:
  workflow_run:
    workflows: ["Release and deploy"]
    types: [completed]
    branches: [main]

jobs:
  discord:
    uses: bnatividad/release-workflows/.github/workflows/discord-notify.yml@v1
    secrets: inherit
