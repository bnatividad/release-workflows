name: Release and deploy

# The pipeline itself lives in bnatividad/release-workflows (vercel-release.yml).
on:
  push:
    branches: [main]

concurrency:
  group: release-and-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # The bot's own "chore(release)" commit must not start another release.
    if: "!startsWith(github.event.head_commit.message, 'chore(release)')"
    uses: bnatividad/release-workflows/.github/workflows/vercel-release.yml@v1
    secrets: inherit
