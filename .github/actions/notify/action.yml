name: Release notification
description: Posts the "deployed" or "failed" message for a release to every configured channel, listing the commits since the previous tag.
inputs:
  state:
    description: '"success" or anything else for a failure.'
    required: true
  sha:
    description: The release commit.
    required: true
  prev-tag:
    description: The tag before this release (may be empty).
    required: false
  app-url:
    description: Public production address, linked in the message.
    required: false
  run-url:
    description: Link shown on a failure. Defaults to the current run.
    required: false
  # Channels. Each one is skipped when its secret is empty.
  discord-webhook-url:
    description: Discord channel webhook.
    required: false
  discord-color:
    description: Hex color for the stripe of a successful Discord message.
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        STATE: ${{ inputs.state }}
        REPO: ${{ github.repository }}
        SHA: ${{ inputs.sha }}
        PREV_TAG: ${{ inputs.prev-tag }}
        APP_URL: ${{ inputs.app-url }}
        RUN_URL: ${{ inputs.run-url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        DISCORD_WEBHOOK_URL: ${{ inputs.discord-webhook-url }}
        DISCORD_COLOR: ${{ inputs.discord-color }}
      run: node "$GITHUB_ACTION_PATH/notify.mjs"
